name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsx scripts/export-curriculum.ts /tmp/curriculum.json
      # Backend smoke tests. Needs no LLM key: validation short-circuits before
      # any model call, and /api/ai/health returns a well-formed { ok: false }
      # when no provider is reachable — which is the case here.
      - run: npm run smoke
